name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm install --no-save acorn@8.12.1
      - run: ./build.sh
      - run: dotnet test tv-service/CouchTor.Tests/CouchTor.Tests.csproj
